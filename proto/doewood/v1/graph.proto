// The typed graph of documents, locations and companies (ADR 0001 section 7, ADR 0002
// section 3).
syntax = "proto3";

package doewood.v1;

service GraphService {
  // A node by id, or by kind and key.
  rpc GetNode(GetNodeRequest) returns (Node);
  // The edges at a node and the nodes at their other ends, ordered by edge kind (its name),
  // then `valid_from` (undated first), then edge id; a page at a time, as ListRecords.
  rpc Neighbours(NeighboursRequest) returns (NeighboursResponse);
  // The documents with a live `party` edge to a company, each once, in the order of their
  // first such edge (its `valid_from`, undated first, then its id); a page at a time, as
  // ListRecords.
  rpc CompanyDocuments(CompanyDocumentsRequest) returns (CompanyDocumentsResponse);

  // The explorer's reads (issue #172). Each is bounded: a page, or caps that end it with
  // `truncated`. Document counts, degrees and weights are kept by the store and trail the
  // edges by a few seconds at most (`stale` says when a large change is still being counted).
  //
  // Live companies (not merged away) matching a filter, with their counts; a page at a time,
  // as ListRecords.
  rpc ListCompanies(ListCompaniesRequest) returns (ListCompaniesResponse);
  // The company-to-company graph: the companies with the most documents that match the
  // filter, and the links between them (shared documents with roles, and corporate events
  // with their dates and source), strongest first.
  rpc CompanyGraph(CompanyGraphRequest) returns (CompanyGraphResponse);
  // The nodes and live edges within `depth` edges of the seeds, either way.
  rpc Subgraph(SubgraphRequest) returns (SubgraphResponse);
  // The shortest paths between two nodes over live edges either way, each edge with its
  // evidence.
  rpc Path(PathRequest) returns (PathResponse);

  // Reversible company merges (ADR 0002 section 1.8). The merge log, newest first: every
  // merge and split, with its actor, evidence, confidence, fused probability and undo state.
  rpc ListMerges(ListMergesRequest) returns (ListMergesResponse);
  // A person's merge: `absorbed_id` into `survivor_id`, logged. FAILED_PRECONDITION when
  // either company was merged away already or the pair is dismissed.
  rpc MergeCompanies(MergeCompaniesRequest) returns (MergeEntry);
  // Undoes a merge or split from its undo payload. FAILED_PRECONDITION, naming them, when
  // later merges or splits involve the same companies, unless `cascade` is set: then they are
  // undone first, newest first.
  rpc UndoMerge(UndoMergeRequest) returns (UndoMergeResponse);
  // Splits a company in two: a new company takes the named aliases, documents and edges.
  // Logged like a merge, so UndoMerge reverses it.
  rpc SplitCompany(SplitCompanyRequest) returns (MergeEntry);
  // Records a permanent "not the same" pair, in both directions: it never merges, whatever
  // the evidence. FAILED_PRECONDITION when the two are merged now (undo with `dismiss`).
  rpc DismissPair(DismissPairRequest) returns (Dismissal);
  // Dismissed pairs, newest first.
  rpc ListDismissals(ListDismissalsRequest) returns (ListDismissalsResponse);

  // Enrichment proposals (ADR 0002 section 1.6): what the decision gate leaves to a person,
  // a registry record to adopt or a company to merge with. Newest first, filtered by state,
  // kind and company.
  rpc ListProposals(ListProposalsRequest) returns (ListProposalsResponse);
  // Accepts an open proposal. A merge goes through the merge log (actor manual, the
  // proposal's evidence), so UndoMerge undoes it; a registry record's identifier joins the
  // company and the next enrichment pass fetches the record by it. NOT_FOUND for an unknown
  // proposal; FAILED_PRECONDITION when it is not open, the pair is dismissed, or the
  // record's identifier belongs to another company.
  rpc AcceptProposal(AcceptProposalRequest) returns (AcceptProposalResponse);
  // Rejects an open proposal. With `dismiss` the rejection is permanent: the proposal is
  // never opened again, and a merge proposal's pair is dismissed (DismissPair), so it never
  // merges either. FAILED_PRECONDITION when it is not open, or (dismiss) the two are one
  // company now.
  rpc RejectProposal(RejectProposalRequest) returns (RejectProposalResponse);
}

enum NodeKind {
  NODE_KIND_UNSPECIFIED = 0;
  // A file's content; the key is its BLAKE3 in lowercase hex.
  NODE_KIND_DOCUMENT = 1;
  // Where a copy of a document lives; the key is the JSON array [endpoint, bucket, key].
  NODE_KIND_LOCATION = 2;
  NODE_KIND_COMPANY = 3;
}

enum EdgeKind {
  EDGE_KIND_UNSPECIFIED = 0;
  // Document -> Location.
  EDGE_KIND_LOCATED_AT = 1;
  // Document -> Company, with a `role` in the props.
  EDGE_KIND_PARTY = 2;
  // Document -> Document.
  EDGE_KIND_AMENDS = 3;
  EDGE_KIND_CITES = 4;
  // Document -> Document, with a `score` in the props.
  EDGE_KIND_SIMILAR_TO = 5;
  // Company -> Company.
  EDGE_KIND_PARENT_OF = 6;
  EDGE_KIND_SUBSIDIARY_OF = 7;
  EDGE_KIND_ACQUIRED = 8;
  EDGE_KIND_MERGED_INTO = 9;
  EDGE_KIND_RENAMED_TO = 10;
  EDGE_KIND_BRANCH_OF = 11;
  EDGE_KIND_TRADING_NAME_OF = 12;
  EDGE_KIND_FORMER_PARENT_OF = 13;
  EDGE_KIND_LIQUIDATED = 14;
}

enum EdgeState {
  EDGE_STATE_UNSPECIFIED = 0;
  EDGE_STATE_PROPOSED = 1;
  EDGE_STATE_ACTIVE = 2;
  EDGE_STATE_CONTESTED = 3;
  EDGE_STATE_RETRACTED = 4;
  EDGE_STATE_SUPERSEDED = 5;
}

enum EdgeSource {
  EDGE_SOURCE_UNSPECIFIED = 0;
  EDGE_SOURCE_REGISTRY = 1;
  EDGE_SOURCE_DOCUMENT = 2;
  EDGE_SOURCE_WEB = 3;
  EDGE_SOURCE_MANUAL = 4;
  EDGE_SOURCE_STORAGE = 5;
}

enum Direction {
  // Both.
  DIRECTION_UNSPECIFIED = 0;
  // Edges whose source is the node.
  DIRECTION_OUT = 1;
  // Edges whose target is the node.
  DIRECTION_IN = 2;
  DIRECTION_BOTH = 3;
}

message Node {
  // A UUID.
  string id = 1;
  NodeKind kind = 2;
  string key = 3;
  // Attributes, as a JSON object.
  string props_json = 4;
}

message Edge {
  string id = 1;
  // Source and target node ids.
  string src = 2;
  string dst = 3;
  EdgeKind kind = 4;
  // Attributes, as a JSON object.
  string props_json = 5;
  // Why we believe it, as a JSON array.
  string evidence_json = 6;
  // From 0 to 1.
  float confidence = 7;
  EdgeState state = 8;
  // `YYYY-MM-DD`: first day the edge holds, and first day it no longer holds. Empty is open.
  string valid_from = 9;
  string valid_to = 10;
  EdgeSource source = 11;
}

message NodeKey {
  NodeKind kind = 1;
  string key = 2;
}

message GetNodeRequest {
  oneof lookup {
    string id = 1;
    NodeKey key = 2;
  }
}

message NeighboursRequest {
  string node_id = 1;
  Direction direction = 2;
  // Only these edge kinds; empty means all.
  repeated EdgeKind edge_kinds = 3;
  // Only neighbours of this kind; unspecified means all.
  NodeKind node_kind = 4;
  // `YYYY-MM-DD`: only edges that hold on this day. Empty means any day.
  string at = 5;
  // Also return retracted and superseded edges.
  bool include_inactive = 6;
  // 1 to 1000; 0 means 50. A page also ends at about 3 MiB of props and evidence.
  uint32 page_size = 7;
  // `next_page_token` of the previous page, with the same filters; empty for the first.
  string page_token = 8;
}

message Neighbour {
  Edge edge = 1;
  // The node at the other end.
  Node node = 2;
}

message NeighboursResponse {
  repeated Neighbour neighbours = 1;
  // Empty on the last page.
  string next_page_token = 2;
}

message CompanyDocumentsRequest {
  string company_id = 1;
  // 1 to 1000; 0 means 50. A page also ends at about 3 MiB of props.
  uint32 page_size = 2;
  // `next_page_token` of the previous page; empty for the first.
  string page_token = 3;
}

message CompanyDocumentsResponse {
  repeated Node documents = 1;
  // Empty on the last page.
  string next_page_token = 2;
}

// Who merged or split.
enum MergeActorKind {
  MERGE_ACTOR_KIND_UNSPECIFIED = 0;
  // Ingest's company matching.
  MERGE_ACTOR_KIND_INGEST = 1;
  // The enrichment job.
  MERGE_ACTOR_KIND_ENRICHMENT = 2;
  // A person, through this API.
  MERGE_ACTOR_KIND_MANUAL = 3;
}

enum MergeOp {
  MERGE_OP_UNSPECIFIED = 0;
  MERGE_OP_MERGE = 1;
  MERGE_OP_SPLIT = 2;
}

message MergeActor {
  MergeActorKind kind = 1;
  // The instance that did it.
  string instance_id = 2;
}

message MergeEntry {
  string id = 1;
  // Its place in the log: later entries have larger numbers.
  int64 seq = 2;
  MergeOp op = 3;
  // Unix seconds.
  int64 at = 4;
  MergeActor actor = 5;
  // A merge's surviving company; a split's company that was split.
  string survivor_id = 6;
  // A merge's absorbed company (now a husk with `merged_into`); a split's new company.
  string absorbed_id = 7;
  // Why, as a JSON array.
  string evidence_json = 8;
  // The actor's confidence, 0 to 1.
  float confidence = 9;
  // The fused (noisy-OR) probability of the evidence, 0 to 1.
  float probability = 10;
  // What moved (aliases, edges, props), as a JSON object; an undo restores exactly that.
  string undo_json = 11;
  // Set once undone: Unix seconds (0 while live) and by whom.
  int64 undone_at = 12;
  MergeActor undone_by = 13;
}

message ListMergesRequest {
  // Only entries where this company is the survivor or the absorbed one; empty for all.
  string company_id = 1;
  // 0 means 50; at most 1000.
  uint32 page_size = 2;
  // `next_page_token` of the previous page; empty for the first.
  string page_token = 3;
}

message ListMergesResponse {
  repeated MergeEntry merges = 1;
  // Empty on the last page.
  string next_page_token = 2;
}

message MergeCompaniesRequest {
  string survivor_id = 1;
  string absorbed_id = 2;
  // Why, as a JSON array; empty means `[]`.
  string evidence_json = 3;
}

message UndoMergeRequest {
  string merge_id = 1;
  // Undo the later entries that depend on this one first, instead of refusing.
  bool cascade = 2;
  // Also record the two companies of the merge as a permanent "not the same" pair.
  bool dismiss = 3;
  // Why (kept on the dismissal); at most 2000 bytes.
  string reason = 4;
}

message UndoMergeResponse {
  // The entries undone, in order: dependents first, `merge_id` last.
  repeated string undone_ids = 1;
  // Parts of a payload not restored because something else changed them since.
  repeated string skipped = 2;
  // The dismissal recorded, when `dismiss` was set.
  Dismissal dismissal = 3;
}

message SplitCompanyRequest {
  string company_id = 1;
  // The new company's name (its props' `name`); required.
  string name = 2;
  // Company aliases that move to the new company (identifiers such as `id:rs_pib:<pib>`, name
  // keys); each must be owned by `company_id`.
  repeated string aliases = 3;
  // Documents whose `party` edges to `company_id` move to the new company.
  repeated string document_ids = 4;
  // Other edges at `company_id` that move (company to company).
  repeated string edge_ids = 5;
  // Also record the two as a permanent "not the same" pair. Such a split cannot be undone.
  bool dismiss = 6;
  // Why; kept as the entry's evidence. At most 2000 bytes.
  string reason = 7;
}

message DismissPairRequest {
  string company_a_id = 1;
  string company_b_id = 2;
  // Why; at most 2000 bytes.
  string reason = 3;
}

message Dismissal {
  // The smaller company id first; it holds in both directions.
  string company_a_id = 1;
  string company_b_id = 2;
  // Unix seconds.
  int64 at = 3;
  MergeActor actor = 4;
  string reason = 5;
  // The merge whose undo recorded it, if any.
  string merge_id = 6;
  int64 seq = 7;
}

message ListDismissalsRequest {
  // Only dismissals of this company; empty for all.
  string company_id = 1;
  // 0 means 50; at most 1000.
  uint32 page_size = 2;
  string page_token = 3;
}

message ListDismissalsResponse {
  repeated Dismissal dismissals = 1;
  string next_page_token = 2;
}

enum ProposalKind {
  PROPOSAL_KIND_UNSPECIFIED = 0;
  // A registry record a name search found, for the company to adopt.
  PROPOSAL_KIND_REGISTRY_RECORD = 1;
  // Another company that may be the same, to merge with.
  PROPOSAL_KIND_MERGE = 2;
}

enum ProposalReason {
  PROPOSAL_REASON_UNSPECIFIED = 0;
  // The fused probability is in the review band (0.50 to 0.90).
  PROPOSAL_REASON_REVIEW_BAND = 1;
  // Two conflicting high-precision hits.
  PROPOSAL_REASON_CONFLICT = 2;
  // The evidence said merge but the pair is dismissed (moved from props by schema 5).
  PROPOSAL_REASON_DISMISSED = 3;
}

enum ProposalState {
  PROPOSAL_STATE_UNSPECIFIED = 0;
  PROPOSAL_STATE_OPEN = 1;
  PROPOSAL_STATE_ACCEPTED = 2;
  PROPOSAL_STATE_REJECTED = 3;
}

message Proposal {
  string id = 1;
  // Its place in the list: later proposals have larger numbers.
  int64 seq = 2;
  ProposalKind kind = 3;
  // The company. For a merge, the smaller id of the pair.
  string company_id = 4;
  // A registry record as `<registry>:<record>` (`apr:companies/12345678`), or a merge's other
  // company id.
  string candidate = 5;
  // What a person needs to decide (a record's registry, id and name), as a JSON object.
  string detail_json = 6;
  // Why, as a JSON array.
  string evidence_json = 7;
  // The fused (noisy-OR) probability, 0 to 1.
  float probability = 8;
  ProposalReason reason = 9;
  ProposalState state = 10;
  // Unix seconds: first proposed, last proposed.
  int64 created_at = 11;
  int64 updated_at = 12;
  // Set once accepted or rejected: Unix seconds (0 while open) and by whom (absent for the
  // dismissed pairs schema 5 moved out of props).
  int64 resolved_at = 13;
  MergeActor resolved_by = 14;
  // A permanent rejection.
  bool dismissed = 15;
  // The merge an accepted merge proposal made.
  string merge_id = 16;
  string note = 17;
}

message ListProposalsRequest {
  // Unspecified for every state.
  ProposalState state = 1;
  // Unspecified for every kind.
  ProposalKind kind = 2;
  // Only proposals about this company (its own, and merge proposals naming it); empty for
  // all.
  string company_id = 3;
  // 0 means 50; at most 1000.
  uint32 page_size = 4;
  // `next_page_token` of the previous page; empty for the first.
  string page_token = 5;
}

message ListProposalsResponse {
  repeated Proposal proposals = 1;
  string next_page_token = 2;
}

message AcceptProposalRequest {
  string proposal_id = 1;
  // A merge's surviving company, one of the two; empty for the one with more documents.
  string survivor_id = 2;
  string note = 3;
}

message AcceptProposalResponse {
  Proposal proposal = 1;
  // The merge made (undo it with UndoMerge), for a merge proposal.
  MergeEntry merge = 2;
  // The identifier alias the company adopted, for a registry record.
  string alias = 3;
}

message RejectProposalRequest {
  string proposal_id = 1;
  // Permanent: never proposed again, and a merge proposal's pair is dismissed.
  bool dismiss = 2;
  string note = 3;
}

message RejectProposalResponse {
  Proposal proposal = 1;
  // The dismissal recorded, for a merge proposal rejected with `dismiss`.
  Dismissal dismissal = 2;
}

// Which companies ListCompanies and CompanyGraph take. Empty fields match every company.
message CompanyFilter {
  // The name starts with this, ignoring case (on the instance store only ASCII letters); at
  // most 200 bytes.
  string name_prefix = 1;
  // The `jurisdiction` prop (`GB`, `RS`), ignoring ASCII case; at most 16 bytes.
  string jurisdiction = 2;
  // Set: only companies with (true) or without (false) an identifier (LEI, VAT, ...).
  optional bool has_identifier = 3;
  // Set: only companies the enrichment job enriched (true) or never enriched (false).
  optional bool enriched = 4;
}

enum CompanyOrder {
  // As DOCUMENTS.
  COMPANY_ORDER_UNSPECIFIED = 0;
  // Most documents first; ties by id, descending.
  COMPANY_ORDER_DOCUMENTS = 1;
  // Highest degree first; ties by id, descending.
  COMPANY_ORDER_DEGREE = 2;
  // By lowercased name in byte order (no name first), then id.
  COMPANY_ORDER_NAME = 3;
}

message CompanyIdentifier {
  // `lei`, `vat`, `rs_pib`, ...
  string kind = 1;
  string value = 2;
}

message CompanySummary {
  string id = 1;
  string name = 2;
  // Other names it was seen under (the `names` prop, without `name`); at most 32.
  repeated string aliases = 3;
  // The identifiers that resolve to it; at most 32.
  repeated CompanyIdentifier identifiers = 4;
  string jurisdiction = 5;
  // Its verified website (`https://acme.com/`), empty when none.
  string website = 6;
  // The domain of its icon: fetch it as `GET /icons/{favicon_domain}`. Empty when none.
  string favicon_domain = 7;
  // Documents with a live `party` edge to it.
  uint64 document_count = 8;
  // Companies it is linked to, by a shared document or a live corporate-event edge.
  uint64 degree = 9;
  // Enriched at least once.
  bool enriched = 10;
}

message ListCompaniesRequest {
  CompanyFilter filter = 1;
  CompanyOrder order = 2;
  // 1 to 1000; 0 means 50. A page also ends at about 3 MiB of props.
  uint32 page_size = 3;
  // `next_page_token` of the previous page, with the same filter and order; empty for the
  // first.
  string page_token = 4;
}

message ListCompaniesResponse {
  repeated CompanySummary companies = 1;
  // Empty on the last page.
  string next_page_token = 2;
  // Counts are still behind the edges: a large change is being counted. Ask again later.
  bool stale = 3;
}

message CompanyGraphRequest {
  CompanyFilter filter = 1;
  // Only links with at least this many shared documents (0 means 1); links with a
  // corporate event are always included.
  uint32 min_weight = 2;
  // Most companies: 1 to 2000; 0 means 500.
  uint32 limit = 3;
  // Most links: 1 to 20000; 0 means 5000.
  uint32 max_links = 4;
}

// One side's role in a pair's shared documents.
message CompanyRole {
  string company_id = 1;
  // `buyer`, `supplier`, ...; empty when the party edge has none.
  string role = 2;
  // Shared documents where it has this role.
  uint64 documents = 3;
}

message CompanyLink {
  // The two companies, the smaller id first.
  string a_id = 1;
  string b_id = 2;
  // Documents both are parties of: the weight.
  uint64 shared_documents = 3;
  // Their roles in those documents (at most 16 role counts a pair).
  repeated CompanyRole roles = 4;
  // The live corporate-event edges between them, either way, with dates and source.
  repeated Edge events = 5;
}

message CompanyGraphResponse {
  // Most documents first.
  repeated CompanySummary companies = 1;
  // Most shared documents first, then most events.
  repeated CompanyLink links = 2;
  // More companies matched than `limit`, more links than `max_links`, or a company had more
  // corporate events than read (50 a company).
  bool truncated = 3;
  // As in ListCompaniesResponse.
  bool stale = 4;
  // Documents with a live party edge in the whole graph, each once however many companies
  // it names; not narrowed by the filter or the caps. Kept with the other counts (no scan).
  uint64 documents_total = 5;
}

message SubgraphRequest {
  // Node ids to start from; 1 to 100. Each is included.
  repeated string seed_ids = 1;
  // Edges away from the nearest seed: 0 to 3; 0 means the seeds only.
  uint32 depth = 2;
  // Only nodes of these kinds besides the seeds; empty means all.
  repeated NodeKind node_kinds = 3;
  // Only these edge kinds; empty means all.
  repeated EdgeKind edge_kinds = 4;
  // Most nodes: 1 to 2000; 0 means 200.
  uint32 limit = 5;
  // Most edges: 1 to 10000; 0 means 1000.
  uint32 max_edges = 6;
  // `YYYY-MM-DD`: only edges that hold on this day (the dated corporate edges). Empty means
  // any day.
  string as_of = 7;
}

message SubgraphNode {
  Node node = 1;
  // Edges from the nearest seed.
  uint32 depth = 2;
}

message SubgraphResponse {
  // Seeds first, then by depth.
  repeated SubgraphNode nodes = 1;
  // The edges followed, each once.
  repeated Edge edges = 2;
  // A cap ended the walk early: nodes, edges, about 8 MiB of props and evidence, or a node
  // whose neighbours were more than its share of the edges.
  bool truncated = 3;
}

message PathRequest {
  string from_id = 1;
  string to_id = 2;
  // Longest path, in edges: 1 to 6; 0 means 4.
  uint32 max_depth = 3;
  // Only these edge kinds; empty means all.
  repeated EdgeKind edge_kinds = 4;
  // `YYYY-MM-DD`: only edges that hold on this day. Empty means any day.
  string as_of = 5;
  // Most paths: 1 to 10; 0 means 1.
  uint32 max_paths = 6;
}

// `nodes[i]` and `nodes[i + 1]` are the ends of `edges[i]` (either way round).
message GraphPath {
  repeated Node nodes = 1;
  repeated Edge edges = 2;
}

message PathResponse {
  // The shortest paths, all of one length; empty when there is none within `max_depth`.
  repeated GraphPath paths = 1;
  // A cap cut the search (5000 visited nodes, 20000 edges a level, about 8 MiB, or a node
  // with more neighbours than its share): a shorter path, or one when none was found, may
  // exist.
  bool truncated = 2;
}
