[package]
name = "doewood-registry"
description = "doewood's public registry clients (ADR 0002 section 2): failure-soft, length-capped, rate-limited and cached: GLEIF, VIES, Wikidata, SEC EDGAR, the Serbian APR and UK Companies House."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# The network side of company enrichment. doewood-enrich stays pure (no I/O); this crate does
# the requests and parses the answers into types. Only identifiers and names are sent, never
# document content (ADR 0002, the privacy rule).
[dependencies]
async-trait.workspace = true
# LEI, VAT and MB/PIB validation before any request; name normalization.
doewood-enrich.workspace = true
# The store traits only (no database): the registry and favicon caches in the store.
doewood-model.workspace = true
# The favicon content checks decode ICO, PNG, GIF, JPEG and WEBP to refuse blank icons; no
# SVG, no AVIF decoder (ADR 0002 section 5.4). Already in the tree through quail.
image = { version = "0.25", default-features = false, features = ["gif", "ico", "jpeg", "png", "webp"] }
# HTTP/1.1, rustls with the `ring` provider, no proxy discovery, no decompression: the same
# build as doewood-s3's.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
# `rt` for `spawn_blocking`: indexing the APR set runs off the async workers. `net` for the
# favicon guard's own DNS lookups.
tokio = { workspace = true, features = ["rt", "sync", "time", "net"] }
tracing.workspace = true
url = "2.5"

[dev-dependencies]
# The store-backed caches tested against the standalone SQLite backend.
doewood-core.workspace = true
doewood-store.workspace = true
# The mock registry server of the tests listens on 127.0.0.1 only.
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }

[lints]
workspace = true
