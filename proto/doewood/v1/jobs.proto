// Jobs: the progress of the sources' scans and ingest, and one-shot reprocessing (ADR 0001,
// section 5).
syntax = "proto3";

package doewood.v1;

import "doewood/v1/common.proto";

service JobsService {
  // Streams the progress of the sources: first one SNAPSHOT update per source, then an update
  // whenever a source's counters or state change, until the client cancels or the server
  // shuts down. A watch of all sources (no `source_ids`) also gets the instance's enrichment
  // job: one ENRICHMENT update with the first snapshot, then one whenever its counters change
  // (none when the instance runs no enrichment job).
  rpc WatchProgress(WatchProgressRequest) returns (stream ProgressUpdate);
  // Starts a one-shot job that re-analyzes the files of a source whose stored quail/hedgehog
  // step versions differ from the running engine's (every file with `force`). Answers at once
  // with the job's id; WatchReprocess streams its progress.
  rpc ReprocessJob(ReprocessJobRequest) returns (ReprocessJobResponse);
  // Streams a reprocess job's progress: its current state first, then every change, until it
  // is done or failed (the last update), the client cancels or the server shuts down.
  rpc WatchReprocess(WatchReprocessRequest) returns (stream ReprocessProgress);
  // Purges a source of this instance (issue #168): stops it, removes every location of it,
  // and deletes the records, search rows and graph nodes that no live location of any source
  // still holds, in bounded batches; then removes the source as RemoveSource does. The source
  // stays in state REMOVED until the purge is done, and a PurgeSource of it again resumes an
  // interrupted purge (it also resumes when the instance starts). Answers at once with the
  // job's id (the running job's, if the source is being purged); WatchPurge streams its
  // progress. A source another instance owns, or whose prefix overlaps another source's, is
  // FAILED_PRECONDITION.
  rpc PurgeSource(PurgeSourceRequest) returns (PurgeJobResponse);
  // Purges everything already orphaned: the records no live location holds, and the
  // Location nodes whose object is gone, with what they leave behind. One job per instance
  // at a time (a second call answers with the running job's id). Safe on several instances
  // at once.
  rpc PurgeOrphans(PurgeOrphansRequest) returns (PurgeJobResponse);
  // Streams a purge job's progress: its current state first, then every change, until it is
  // done or failed (the last update), the client cancels or the server shuts down.
  rpc WatchPurge(WatchPurgeRequest) returns (stream PurgeProgress);
}

message WatchProgressRequest {
  // Only these sources; empty watches all of this instance's sources, including ones added
  // later.
  repeated string source_ids = 1;
}

message ProgressCounters {
  // Objects in the bucket (under the prefix) that discovery knows about.
  uint64 seen = 1;
  // Events since this instance started: keys not seen before, changed (ETag or size), and
  // gone.
  uint64 new = 2;
  uint64 changed = 3;
  uint64 deleted = 4;
  // Objects ingested, and objects whose ingest failed.
  uint64 processed = 5;
  uint64 failed = 6;
  // Documents waiting in the LLM queue (the source's policy asked for a summary).
  uint64 queued_llm = 7;
  // Objects seen and not ingested yet.
  uint64 pending = 8;
  // Documents the LLM queue summarized, and those whose summary failed (the record stays,
  // without a summary; see `SourceProgress.llm_last_error`).
  uint64 summarized = 9;
  uint64 llm_failed = 10;
  // Tokens (prompt plus completion) the source's summaries spent on the current UTC day,
  // which its daily budget is checked against.
  uint64 llm_tokens_today = 11;
}

message SourceProgress {
  string source_id = 1;
  SourceState state = 2;
  string state_reason = 3;
  ProgressCounters counters = 4;
  // The number of the current (or last) scan pass; 0 before the first.
  uint64 pass = 5;
  bool pass_in_progress = 6;
  // When the last pass completed, Unix seconds; 0 if none has.
  int64 last_pass_completed_at = 7;
  bool scanner_running = 8;
  // The latest error of a failed LLM summary of the source; empty if none failed.
  string llm_last_error = 9;
}

message ProgressUpdate {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    // The source as it is when the stream starts (or when it appears).
    KIND_SNAPSHOT = 1;
    // Its counters (or its scanner) changed.
    KIND_COUNTERS = 2;
    // Its state changed; `previous_state` says from what.
    KIND_STATE_CHANGED = 3;
    // It was removed. The last update about it.
    KIND_REMOVED = 4;
    // The enrichment job's counters (`enrichment` is set, `progress` is not).
    KIND_ENRICHMENT = 5;
  }
  Kind kind = 1;
  SourceProgress progress = 2;
  // For KIND_STATE_CHANGED and KIND_REMOVED.
  SourceState previous_state = 3;
  // When the update was made, Unix seconds.
  int64 at = 4;
  // For KIND_ENRICHMENT.
  EnrichmentProgress enrichment = 5;
}

// The instance's enrichment job (ADR 0002 section 6), counted since the instance started.
message EnrichmentProgress {
  // Companies enriched (every due registry asked, whatever it answered).
  uint64 enriched = 1;
  // Companies merged by the decision gate (merge log actor `enrichment`).
  uint64 merged = 2;
  // Proposals recorded for a person: the review band, conflicts, dismissed pairs.
  uint64 proposed = 3;
  // Companies whose enrichment failed (a store error); retried on the next pass.
  uint64 failed = 4;
  // Registry warnings (a registry down, refusing, rate limiting, ...).
  uint64 registry_warnings = 5;
  // Dated edges written.
  uint64 edges = 6;
  // Websites verified and stored.
  uint64 websites = 7;
  // Passes over the due companies completed.
  uint64 passes = 8;
  // When the last pass completed, Unix seconds; 0 before the first.
  int64 last_pass_completed_at = 9;
  // Whether a pass is running now.
  bool running = 10;
  // Dated edges that landed on the company an end was merged into while the company was
  // worked on (a merge committed between the lookup and the write).
  uint64 redirected = 11;
  // The registry delta feeds, one entry per feed (`gleif`, `edgar`, `apr`,
  // `companies_house`), counted on this instance since it started.
  repeated FeedProgress feeds = 12;
}

// One registry delta feed (ADR 0002 section 6) on this instance. One instance per cluster
// reads each feed at a time (a lease in the shared store); the others count nothing.
message FeedProgress {
  // `gleif`, `edgar`, `apr` or `companies_house`.
  string feed = 1;
  // Whether it is switched on here (and its registry is asked).
  bool enabled = 2;
  // Whether this instance holds the feed's lease now.
  bool leader = 3;
  // Runs completed here: a delta file set, a day of the index, a set download, a stream
  // connection.
  uint64 runs = 4;
  // Records read (LEI and relationship records, index rows, set entries compared, stream
  // events).
  uint64 records = 5;
  // Companies the graph has that a record named, made due for their registry.
  uint64 companies_due = 6;
  // Runs that failed (each logged at WARN); the feed is tried again later.
  uint64 failures = 7;
  // When a run last completed, Unix seconds; 0 before the first.
  int64 last_run_at = 8;
  // Where the feed stands, as a time (GLEIF: the publication; EDGAR: the last index day;
  // APR: the set's date), Unix seconds; for Companies House the stream's timepoint. 0: none.
  int64 position = 9;
}

message ReprocessJobRequest {
  string source_id = 1;
  // Re-analyze every file of the source, current or not.
  bool force = 2;
}

message ReprocessJobResponse {
  string job_id = 1;
}

message WatchReprocessRequest {
  // From ReprocessJobResponse. Jobs live in the instance that started them, until it restarts.
  string job_id = 1;
}

message ReprocessProgress {
  enum State {
    STATE_UNSPECIFIED = 0;
    // Comparing the stored step versions with the running engine's.
    STATE_SELECTING = 1;
    // The selected files are back in the ingest queue and being analyzed.
    STATE_RUNNING = 2;
    // Nothing of the source is waiting any more. The last update.
    STATE_DONE = 3;
    // The job stopped; see `error`. The last update.
    STATE_FAILED = 4;
  }
  string job_id = 1;
  string source_id = 2;
  State state = 3;
  bool force = 4;
  // Ingested files compared so far, and those put back in the queue.
  uint64 examined = 5;
  uint64 selected = 6;
  // The source's files now: ingested (done or skipped), failed, and waiting.
  uint64 processed = 7;
  uint64 failed = 8;
  uint64 pending = 9;
  string error = 10;
  // When the update was made, Unix seconds.
  int64 at = 11;
}

message PurgeSourceRequest {
  string source_id = 1;
}

message PurgeOrphansRequest {}

message PurgeJobResponse {
  string job_id = 1;
}

message WatchPurgeRequest {
  // From PurgeJobResponse. Jobs live in the instance that started them, until it restarts.
  string job_id = 1;
}

message PurgeProgress {
  enum State {
    STATE_UNSPECIFIED = 0;
    // Waiting: for the shared store to connect, or (a source) for the files ingest still
    // holds to finish.
    STATE_WAITING = 1;
    // Deleting, a batch at a time.
    STATE_RUNNING = 2;
    // Nothing is left to purge. The last update.
    STATE_DONE = 3;
    // The job stopped; see `error`. Purging again resumes it. The last update.
    STATE_FAILED = 4;
  }
  string job_id = 1;
  // The purged source; empty for PurgeOrphans.
  string source_id = 2;
  State state = 3;
  // Batches done (each one transaction).
  uint64 batches = 4;
  // Rows the batches looked at: live locations removed, Location nodes and records examined.
  uint64 examined = 5;
  // Location nodes deleted.
  uint64 locations = 6;
  // Records deleted, with their search rows, sketches and Document nodes.
  uint64 records = 7;
  // Other Document nodes deleted: pending references left without edges.
  uint64 other_documents = 8;
  // Company nodes deleted.
  uint64 companies = 9;
  // This instance's LLM queue entries of the deleted records, deleted.
  uint64 llm_jobs = 10;
  string error = 11;
  // When the update was made, Unix seconds.
  int64 at = 12;
}
