[package]
name = "doewood"
description = "Watches S3-compatible storage, extracts metadata with quail and hedgehog, and serves it over gRPC"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
clap = { version = "4.5", features = ["derive"] }
doewood-core.workspace = true
doewood-store.workspace = true
# Text exposition only; no protobuf, no process collector.
prometheus = { version = "0.14", default-features = false }
tokio = { version = "1.47", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt", "json", "env-filter", "ansi"] }

[dev-dependencies]
serde_json = "1"
tempfile = "3.20"

[lints]
workspace = true
