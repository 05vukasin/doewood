name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with: { components: "clippy, rustfmt" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
  # The shared store against a real Postgres with pgvector; elsewhere those tests skip.
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: pw
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      DOEWOOD_TEST_POSTGRES_URL: postgres://postgres:pw@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
      # Fails if any Postgres test skipped instead of running.
      - run: |
          cargo test -p doewood-pg -p doewood-api -p doewood -- --nocapture 2>&1 | tee test.log
          ! grep -q "skipping: DOEWOOD_TEST_POSTGRES_URL" test.log
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
  # The S3 integration tests (crates/doewood-s3/tests/minio.rs) against MinIO in a service
  # container. MinIO no longer publishes `minio/minio` images; the frozen Bitnami build starts
  # the server without arguments, which a service container needs.
  minio:
    runs-on: ubuntu-latest
    services:
      minio:
        image: bitnamilegacy/minio:2025.7.23
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports: ["9000:9000"]
    env:
      DOEWOOD_TEST_S3_ENDPOINT: http://127.0.0.1:9000
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
      - name: Wait for MinIO
        run: |
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:9000/minio/health/live && exit 0
            sleep 1
          done
          exit 1
      # Fails if any MinIO test skipped instead of running.
      - run: |
          cargo test -p doewood-s3 --test minio -- --nocapture 2>&1 | tee test.log
          ! grep -q "DOEWOOD_TEST_S3_ENDPOINT is not set: skipped" test.log
