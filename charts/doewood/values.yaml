# Instances. Each is independent with its own SQLite store on its own volume; give each its own
# sources (ADR 0001, section 1).
replicas: 1

image:
  repository: doewood
  # Defaults to the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

# The shared Postgres + pgvector database, from an existing Secret. Unset: standalone.
postgres:
  existingSecret: ""
  key: url

# The master key (base64 of 32 random bytes), from an existing Secret. Unset: each instance
# generates a development key file on its volume, with a loud warning.
masterKey:
  existingSecret: ""
  key: master-key

# More environment variables, for example RUST_LOG or DOEWOOD_INGEST_JOBS
# (docs/configuration.md).
extraEnv: []
#  - name: RUST_LOG
#    value: info

service:
  type: ClusterIP
  grpcPort: 7443
  opsPort: 7444

persistence:
  size: 1Gi
  # Empty: the cluster's default StorageClass.
  storageClass: ""
  accessModes: [ReadWriteOnce]

# Scanned pages OCR'd at the same time (DOEWOOD_OCR_JOBS): each job is its own engine, about
# 0.55 GiB more, and 2 read about 35-45 % more pages a second than 1 with the same text
# (docs/deploy.md, "OCR per page"). Empty: the binary's own default (one engine below 10 GiB).
ocrJobs: 2

# The memory includes the second OCR engine (+0.6 GiB over the 1 Gi / 4 Gi of one engine).
resources:
  requests:
    cpu: 500m
    memory: 1638Mi
  limits:
    memory: 4710Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

# Up to 10 s for the gRPC calls in flight, then the store is checkpointed and closed.
terminationGracePeriodSeconds: 30

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
