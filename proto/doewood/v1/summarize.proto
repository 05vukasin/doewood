// On-demand summaries with quail's `summary.llm` (ADR 0001, section 6): the digest, the fact
// check and the extractive fallback. Skips the LLM queue and stores nothing: not the record,
// not a summary, not the spend (a source's daily budget governs its queue only).
syntax = "proto3";

package doewood.v1;

service SummarizeService {
  // Summarizes one file now, with the named or the default AI provider. Errors:
  // - FAILED_PRECONDITION: no AI provider is configured (or the one used has no API key, or
  //   no base URL where its preset needs one); the source's LLM policy is `off`; the file has
  //   no text;
  // - NOT_FOUND: the provider or the source does not exist;
  // - UNAVAILABLE: ingest does not run on this instance, or the object cannot be read.
  // A provider that fails or answers badly is not an error: the response is then the
  // extractive summary, with `extractive` set and the reason in `warnings`.
  rpc Summarize(SummarizeRequest) returns (SummarizeResponse);
}

// An object in one of this instance's sources.
// The source's LLM policy must not be `off`.
message S3Location {
  string source_id = 1;
  string key = 2;
}

message SummarizeRequest {
  oneof input {
    // The file's bytes, up to the server's message size limit (64 MiB by default).
    bytes content = 1;
    // Or an object to fetch.
    S3Location location = 2;
  }
  // The file name; its extension picks the reader (`.pdf`, `.docx`, `.xlsx`, ...). Required
  // with `content`; defaults to the key with `location`.
  string name = 3;
  // An AI provider name (see ConfigService.ListAiProviders); empty uses the default.
  string provider = 4;
}

message FactCheck {
  // Facts in the digest that were checked against the document.
  uint32 checked = 1;
  // Of those, the ones the document supports.
  uint32 supported = 2;
  // The statements it does not support.
  repeated string unsupported = 3;
}

message SummarizeResponse {
  // The summary.
  string digest = 1;
  FactCheck fact_check = 2;
  // True when the LLM was unavailable or failed the fact check, and the digest is the
  // extractive fallback.
  bool extractive = 3;
  // The provider and model that wrote it; empty for the extractive fallback.
  string provider = 4;
  string model = 5;
  // The file's BLAKE3 and its kind, as quail classified it.
  string blake3 = 6;
  string kind = 7;
  // Why the model's output was not used (the provider's error, the failed fact check), when
  // it was not. Keys are never part of it.
  repeated string warnings = 8;
}
