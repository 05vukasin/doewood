# Publishes the container image to GitHub Container Registry, as ghcr.io/05vukasin/doewood.
#
# Only from the release branch and release tags: a push to `main` (tags `edge` and `sha-<short>`)
# or a `vX.Y.Z` tag (tags `X.Y.Z`, `X.Y` and `latest`). Never from `staging` or a pull request;
# those build and smoke-test the image in ci.yml without pushing it.
#
# Each platform is built on its own native runner (no QEMU), smoke-tested like ci.yml, then
# pushed by digest; the `merge` job joins the digests into one multi-platform image, signs it
# with cosign (keyless, GitHub OIDC) and attests its build provenance.
name: image
on:
  push:
    branches: [main]
    tags: ["v*"]
permissions:
  contents: read
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false
env:
  IMAGE: ghcr.io/05vukasin/doewood
jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.source=https://github.com/05vukasin/doewood
            org.opencontainers.image.licenses=MIT
      - uses: docker/setup-buildx-action@v3
      # Build for this platform and load it, to smoke-test before anything is pushed.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          tags: doewood:smoke
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=image-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.arch }}
      # The same smoke test as ci.yml: non-root 10001, read-only root, healthy, OCR Ready.
      - name: Smoke test
        run: |
          docker run --rm doewood:smoke version
          docker run -d --name dw -p 7444:7444 --read-only --cap-drop ALL --tmpfs /tmp \
            --tmpfs /data:uid=10001,gid=10001 doewood:smoke
          for i in $(seq 1 60); do
            curl -sf 127.0.0.1:7444/readyz && break
            sleep 1
          done
          curl -sf 127.0.0.1:7444/healthz
          curl -sf 127.0.0.1:7444/readyz
          docker exec dw id
          test "$(docker exec dw id -u)" = 10001
          for i in $(seq 1 60); do
            docker logs dw 2>&1 | grep -q '"ocr":"Ready' && break
            sleep 1
          done
          docker logs dw 2>&1 | grep '"ingest configured"'
          docker logs dw 2>&1 | grep -q '"ocr":"Ready'
          docker rm -f dw
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Push this platform by digest only (no tag yet); the cache makes this a re-export.
      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=image-${{ matrix.arch }}
      - name: Keep the digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1
  merge:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # main: `edge` and `sha-<short>`; vX.Y.Z: `X.Y.Z`, `X.Y` and `latest`.
          flavor: latest=false
          tags: |
            type=edge,branch=main
            type=sha,prefix=sha-,format=short,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.source=https://github.com/05vukasin/doewood
            org.opencontainers.image.licenses=MIT
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # One multi-platform index from the per-platform digests (their SBOM and provenance
      # attestations come along), tagged, with the source annotation so the package links here.
      - name: Create the manifest list
        working-directory: ${{ runner.temp }}/digests
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          args=()
          while IFS= read -r tag; do [ -n "$tag" ] && args+=(-t "$tag"); done <<< "$TAGS"
          docker buildx imagetools create "${args[@]}" \
            --annotation "index:org.opencontainers.image.source=https://github.com/05vukasin/doewood" \
            --annotation "index:org.opencontainers.image.licenses=MIT" \
            $(printf "${IMAGE}@sha256:%s " *)
      - id: digest
        name: Read the digest
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          digest=$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{json .Manifest}}' | jq -r .digest)
          test -n "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          docker buildx imagetools inspect "${IMAGE}@${digest}"
      - uses: sigstore/cosign-installer@v3
      # Keyless: the certificate names this workflow and ref (see docs/deploy.md for `cosign verify`).
      - name: Sign
        env:
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true
