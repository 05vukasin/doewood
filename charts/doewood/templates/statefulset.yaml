apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "doewood.fullname" . }}
  labels:
    {{- include "doewood.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  serviceName: {{ include "doewood.fullname" . }}-headless
  # Instances are independent: none waits for another.
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      {{- include "doewood.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "doewood.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: doewood
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: [serve]
          env:
            - name: DOEWOOD_DATA_DIR
              value: /data
            - name: DOEWOOD_LISTEN
              value: "0.0.0.0:7443"
            - name: DOEWOOD_OPS_LISTEN
              value: "0.0.0.0:7444"
            # The pod name: stable across restarts, and the owner named on claimed sources.
            - name: DOEWOOD_INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            {{- with .Values.postgres.existingSecret }}
            - name: DOEWOOD_POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.postgres.key }}
            {{- end }}
            {{- with .Values.masterKey.existingSecret }}
            - name: DOEWOOD_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.masterKey.key }}
            {{- end }}
            {{- with .Values.ocrJobs }}
            - name: DOEWOOD_OCR_JOBS
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: grpc
              containerPort: 7443
            - name: ops
              containerPort: 7444
          livenessProbe:
            httpGet:
              path: /healthz
              port: ops
            periodSeconds: 10
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /readyz
              port: ops
            # Ready about 0.15 s after the start (issue #118): a short period lets a new pod
            # take traffic sooner; 8 failures keep about 16 s before it is taken out.
            periodSeconds: 2
            failureThreshold: 8
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            # The root filesystem is read-only; SQLite may spill temporary files here.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "doewood.selectorLabels" . | nindent 10 }}
      spec:
        accessModes:
          {{- toYaml .Values.persistence.accessModes | nindent 10 }}
        {{- with .Values.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
