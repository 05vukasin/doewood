[package]
name = "doewood-pg"
description = "doewood's shared store: records, the graph, source claims and search in Postgres (+ pgvector when available)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
async-trait.workspace = true
deadpool-postgres = { version = "0.14", default-features = false, features = ["rt_tokio_1"] }
doewood-core.workspace = true
doewood-model.workspace = true
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
# ring, not aws-lc-rs: no C toolchain beyond what `cc` needs, on every CI platform.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8"
serde_json.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["time"] }
tokio-postgres = { version = "0.7", default-features = false, features = ["runtime", "with-serde_json-1", "with-uuid-1", "with-time-0_3"] }
tokio-postgres-rustls = "0.13"
tracing.workspace = true
uuid.workspace = true
webpki-roots = "1"

[dev-dependencies]
doewood-model = { workspace = true, features = ["conformance"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
