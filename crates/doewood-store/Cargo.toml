[package]
name = "doewood-store"
description = "doewood's instance-local SQLite store: settings, encrypted secrets, sources, jobs, progress"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
chacha20poly1305 = "0.10"
doewood-core.workspace = true
# `bundled` compiles SQLite into the binary: no system library is needed.
rusqlite = { version = "0.41", features = ["bundled"] }
serde_json = "1"
thiserror.workspace = true
zeroize.workspace = true

[dev-dependencies]
tempfile = "3.20"

[lints]
workspace = true
