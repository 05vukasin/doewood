// Jobs: the progress of the sources' scans and ingest, and one-shot reprocessing (ADR 0001,
// section 5).
syntax = "proto3";

package doewood.v1;

import "doewood/v1/common.proto";

service JobsService {
  // Streams the progress of the sources: first one SNAPSHOT update per source, then an update
  // whenever a source's counters or state change, until the client cancels or the server
  // shuts down.
  rpc WatchProgress(WatchProgressRequest) returns (stream ProgressUpdate);
  // Starts a one-shot job that re-analyzes the files of a source whose stored quail/hedgehog
  // step versions differ from the running engine's (every file with `force`). Answers at once
  // with the job's id; WatchReprocess streams its progress.
  rpc ReprocessJob(ReprocessJobRequest) returns (ReprocessJobResponse);
  // Streams a reprocess job's progress: its current state first, then every change, until it
  // is done or failed (the last update), the client cancels or the server shuts down.
  rpc WatchReprocess(WatchReprocessRequest) returns (stream ReprocessProgress);
}

message WatchProgressRequest {
  // Only these sources; empty watches all of this instance's sources, including ones added
  // later.
  repeated string source_ids = 1;
}

message ProgressCounters {
  // Objects in the bucket (under the prefix) that discovery knows about.
  uint64 seen = 1;
  // Events since this instance started: keys not seen before, changed (ETag or size), and
  // gone.
  uint64 new = 2;
  uint64 changed = 3;
  uint64 deleted = 4;
  // Objects ingested, and objects whose ingest failed.
  uint64 processed = 5;
  uint64 failed = 6;
  // Documents waiting in the LLM queue. 0 until the LLM queue exists.
  uint64 queued_llm = 7;
  // Objects seen and not ingested yet.
  uint64 pending = 8;
}

message SourceProgress {
  string source_id = 1;
  SourceState state = 2;
  string state_reason = 3;
  ProgressCounters counters = 4;
  // The number of the current (or last) scan pass; 0 before the first.
  uint64 pass = 5;
  bool pass_in_progress = 6;
  // When the last pass completed, Unix seconds; 0 if none has.
  int64 last_pass_completed_at = 7;
  bool scanner_running = 8;
}

message ProgressUpdate {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    // The source as it is when the stream starts (or when it appears).
    KIND_SNAPSHOT = 1;
    // Its counters (or its scanner) changed.
    KIND_COUNTERS = 2;
    // Its state changed; `previous_state` says from what.
    KIND_STATE_CHANGED = 3;
    // It was removed. The last update about it.
    KIND_REMOVED = 4;
  }
  Kind kind = 1;
  SourceProgress progress = 2;
  // For KIND_STATE_CHANGED and KIND_REMOVED.
  SourceState previous_state = 3;
  // When the update was made, Unix seconds.
  int64 at = 4;
}

message ReprocessJobRequest {
  string source_id = 1;
  // Re-analyze every file of the source, current or not.
  bool force = 2;
}

message ReprocessJobResponse {
  string job_id = 1;
}

message WatchReprocessRequest {
  // From ReprocessJobResponse. Jobs live in the instance that started them, until it restarts.
  string job_id = 1;
}

message ReprocessProgress {
  enum State {
    STATE_UNSPECIFIED = 0;
    // Comparing the stored step versions with the running engine's.
    STATE_SELECTING = 1;
    // The selected files are back in the ingest queue and being analyzed.
    STATE_RUNNING = 2;
    // Nothing of the source is waiting any more. The last update.
    STATE_DONE = 3;
    // The job stopped; see `error`. The last update.
    STATE_FAILED = 4;
  }
  string job_id = 1;
  string source_id = 2;
  State state = 3;
  bool force = 4;
  // Ingested files compared so far, and those put back in the queue.
  uint64 examined = 5;
  uint64 selected = 6;
  // The source's files now: ingested (done or skipped), failed, and waiting.
  uint64 processed = 7;
  uint64 failed = 8;
  uint64 pending = 9;
  string error = 10;
  // When the update was made, Unix seconds.
  int64 at = 11;
}
