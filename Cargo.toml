[workspace]
resolver = "3"
# Planned crates (ADR 0001), added one per step. The registry clients (ADR 0002 section 2) live in
# doewood-registry, one client per step: GLEIF first.
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/05vukasin/doewood"
rust-version = "1.97"

[workspace.dependencies]
doewood-api = { path = "crates/doewood-api" }
doewood-core = { path = "crates/doewood-core" }
doewood-enrich = { path = "crates/doewood-enrich" }
# Features are chosen by the binary (`ocr`, on by default there).
doewood-ingest = { path = "crates/doewood-ingest", default-features = false }
doewood-model = { path = "crates/doewood-model" }
doewood-pg = { path = "crates/doewood-pg" }
doewood-registry = { path = "crates/doewood-registry" }
doewood-s3 = { path = "crates/doewood-s3" }
doewood-store = { path = "crates/doewood-store" }
async-trait = "0.1"
# `raw_value`: records are written and read as JSON text, without a `Value` tree (#98).
serde_json = { version = "1", features = ["raw_value"] }
thiserror = "2"
time = { version = "0.3", default-features = false, features = ["std"] }
tokio = { version = "1.47", default-features = false }
tracing = "0.1"
uuid = { version = "1.18", features = ["v7"] }
zeroize = "1.8"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"

# Portable: no target-cpu=native anywhere. Unwinding, not abort: a panic on a hostile file
# (quail contains its steps; doewood wraps every hedgehog call in `catch_unwind`) must end only
# that file, never the service.
[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
strip = "symbols"
panic = "unwind"

# Dev builds keep dependencies optimized (SQLite, the AEAD, quail, hedgehog) so tests stay fast.
[profile.dev.package."*"]
opt-level = 2

# `[patch]` does not carry over to dependents, so the hardened third-party crates of quail and
# hedgehog are patched in again here, from the same revisions as the dependencies
# (`vendor/` in each repository; cargo finds a git package by name).
[patch.crates-io]
# quail: hayro with per-file decode budgets and image size checks for hostile PDFs, and the
# faster lingua of quail-text (output unchanged).
hayro = { git = "https://github.com/05vukasin/quail", rev = "5557ef5" }
hayro-syntax = { git = "https://github.com/05vukasin/quail", rev = "5557ef5" }
hayro-interpret = { git = "https://github.com/05vukasin/quail", rev = "5557ef5" }
hayro-jbig2 = { git = "https://github.com/05vukasin/quail", rev = "5557ef5" }
lingua = { git = "https://github.com/05vukasin/quail", rev = "5557ef5" }
# hedgehog: calamine 0.37 with the fixes for hostile files its fuzzer found, and its
# rust_xlsxwriter.
calamine = { git = "https://github.com/05vukasin/hedgehog", rev = "fac6eba" }
rust_xlsxwriter = { git = "https://github.com/05vukasin/hedgehog", rev = "fac6eba" }
