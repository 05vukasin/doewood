// quail and hedgehog records, keyed by the BLAKE3 of the file's bytes.
syntax = "proto3";

package doewood.v1;

service RecordsService {
  // One record.
  rpc GetRecord(GetRecordRequest) returns (Record);
  // The records of the files in a source, ordered by hash, a page at a time.
  rpc ListRecords(ListRecordsRequest) returns (ListRecordsResponse);
  // A document's text with block locations (pages, blocks with kinds and zones, heading
  // paths), a page of blocks at a time. Stored by ingest beside the record; NOT_FOUND when
  // there is none (no record, a file without text, or a record from before the text was kept).
  rpc GetDocumentText(GetDocumentTextRequest) returns (GetDocumentTextResponse);
  // What documents pay for and how much (issue #193): one row per document with payment
  // facts, filtered, ordered by hash, a page at a time.
  rpc ListPayments(ListPaymentsRequest) returns (ListPaymentsResponse);
  // What suppliers are paid: per supplier, totals per currency (never summed across
  // currencies) and period (recurring fees apart from one-off prices), grouped by category,
  // year or month, and the categories and subjects the supplier provides.
  rpc SupplierSpend(SupplierSpendRequest) returns (SupplierSpendResponse);
  // The normalised key facts of one document (issue #194): parties, dates and term, renewal
  // and notice, payment, penalties, guarantees, law and court, each with its confidence and
  // highlights, as typed fields and as compact canonical JSON made to be handed to an LLM.
  // NOT_FOUND when the document has no key facts (no record, no card, or a record from
  // before them).
  rpc GetDocumentCard(GetDocumentCardRequest) returns (DocumentCard);
  // The documents whose key facts match every filter set (issue #194), ordered by hash, a
  // page at a time.
  rpc FindDocuments(FindDocumentsRequest) returns (FindDocumentsResponse);
}

message GetRecordRequest {
  // 64 hex digits.
  string blake3 = 1;
}

message Record {
  // 64 lowercase hex digits.
  string blake3 = 1;
  // The record as JSON, exactly as stored.
  string body_json = 2;
  // The step versions that produced it (`quail` -> `1.4.0`, ...).
  map<string, string> versions = 3;
  // When it was last written, Unix seconds.
  int64 updated_at = 4;
}

message ListRecordsRequest {
  // A source of this instance.
  string source_id = 1;
  // 1 to 1000; 0 means 50.
  uint32 page_size = 2;
  // `next_page_token` of the previous page; empty for the first.
  string page_token = 3;
}

message ListRecordsResponse {
  repeated Record records = 1;
  // Empty on the last page.
  string next_page_token = 2;
}

message GetDocumentTextRequest {
  // 64 hex digits.
  string blake3 = 1;
  // Blocks per page, 1 to 1000; 0 means 200.
  uint32 page_size = 2;
  // `next_page_token` of the previous page; empty for the first.
  string page_token = 3;
  // Leave out the highlights of the blocks (`TextBlock.highlights`).
  bool skip_highlights = 4;
}

message GetDocumentTextResponse {
  // 64 lowercase hex digits.
  string blake3 = 1;
  // The step that extracted the text (`pdf.extract`, `docx.extract`, `text.extract`, ...;
  // `hedgehog` for a spreadsheet).
  string extractor = 2;
  // That step's version (hedgehog's revision for a spreadsheet).
  string extractor_version = 3;
  // The size cap was reached when the text was stored: the blocks after the last one are
  // missing.
  bool truncated = 4;
  // The pages that hold this response's blocks, in order. A page without blocks comes in the
  // response that holds the next block (in the last response when no block follows it), so a
  // walk over every response sees each page once, blocks spread over the responses.
  repeated TextPage pages = 5;
  // Blocks in the whole document.
  uint32 total_blocks = 6;
  // Empty on the last page.
  string next_page_token = 7;
  // When the text was stored, Unix seconds.
  int64 updated_at = 8;
}

// One page of a document: a printed page, a section of a flowing document (DOCX), or a sheet.
message TextPage {
  // The page's index in the document, or the sheet's in the workbook, from 0.
  uint32 index = 1;
  // The sheet's name, for a spreadsheet.
  string sheet = 2;
  // Where the text came from: `native`, `ocr` or `none` (an image page not OCR'd).
  string origin = 3;
  // Its blocks on this response page, in reading order.
  repeated TextBlock blocks = 4;
}

message TextBlock {
  // Its index among all the document's blocks, from 0: stable for the same bytes and step
  // versions.
  uint32 index = 1;
  // `heading`, `paragraph`, `list_item`, `table_row`, `sheet_row`, `note`, `annotation`; new
  // kinds may come.
  string kind = 2;
  // The text. A table or sheet row's cells are separated by tabs, a tab per column.
  string text = 3;
  // The page's index (as `TextPage.index`).
  uint32 page = 4;
  // The texts of the headings above it, the highest first (a heading's own text is not in its
  // path). Derived from the heading blocks; headings in a header or footer do not count.
  repeated string heading_path = 5;
  // The sheet's name, for a sheet row.
  string sheet = 6;
  // A table row's row in its table, or a sheet row's row in its sheet, from 0.
  optional uint32 row = 7;
  // Where on the page it is: `header`, `footer`, `body`, `title`, `table`, `signature` or
  // `unknown`; empty for a sheet row.
  string zone = 8;
  // A heading's level, 1 the highest; 0 for other blocks.
  uint32 level = 9;
  // A table row's table, counted on its page from 0.
  optional uint32 table = 10;
  // The facts over this block (issue #194), from every `<namespace>.highlight` of the record
  // (`card.*`, `contract.*`, `payment.*`, ...), ordered by start, end, key. Empty with
  // `skip_highlights`, and for a record from before the key facts.
  repeated BlockHighlight highlights = 11;
}

// A fact over a block's text: characters `start` to `end` (Unicode scalar values, end
// exclusive) of `TextBlock.text`.
message BlockHighlight {
  // The fact key (`card.notice`, `contract.penalty`, `payment.amount`, ...).
  string key = 1;
  uint32 start = 2;
  uint32 end = 3;
  // The fact's confidence, 0 to 1.
  float conf = 4;
}

message ListPaymentsRequest {
  // Only documents whose supplier is this company (a UUID).
  string supplier_id = 1;
  // Only documents whose buyer is this company (a UUID).
  string buyer_id = 2;
  // Only this category code (`it_software`, `legal`, ...; see docs/api.md).
  string category = 3;
  // Only this period: `one_off`, `monthly`, `quarterly` or `yearly`.
  string period = 4;
  // Only this currency (ISO 4217, `RSD`).
  string currency = 5;
  // Only documents dated on or after this day (`YYYY-MM-DD`); undated ones are left out.
  string date_from = 6;
  // Only documents dated on or before this day (`YYYY-MM-DD`).
  string date_to = 7;
  // 1 to 1000; 0 means 50.
  uint32 page_size = 8;
  // `next_page_token` of the previous page; empty for the first.
  string page_token = 9;
}

message ListPaymentsResponse {
  repeated Payment payments = 1;
  // Empty on the last page.
  string next_page_token = 2;
}

// What one document pays for and how much. Amounts are exact decimal text (`120000.00`).
// A field the document does not state is empty.
message Payment {
  // The record: 64 lowercase hex digits.
  string blake3 = 1;
  // The Document node, when its graph was written.
  string document_id = 2;
  // The supplier company (the document's `party` edge marked `side: supplier`).
  string supplier_id = 3;
  // The supplier's name as the document writes it.
  string supplier_name = 4;
  // The buyer company (`side: buyer`).
  string buyer_id = 5;
  // The buyer's name as the document writes it.
  string buyer_name = 6;
  // What is paid for, as the document states it.
  string subject = 7;
  // Where the subject came from: `clause`, `after_heading`, `line_items` or `title`.
  string subject_source = 8;
  // The category code.
  string category = 9;
  // The category's label.
  string category_label = 10;
  // The headline price: gross when stated, else the plain total, else net (`amount_basis`).
  string amount = 11;
  // `gross`, `net` or `unstated`.
  string amount_basis = 12;
  // ISO 4217.
  string currency = 13;
  // The price without VAT, the VAT and the price with VAT, each where stated.
  string net = 14;
  string vat = 15;
  string gross = 16;
  // `one_off`, `monthly`, `quarterly` or `yearly`. A monthly fee is the fee of one month,
  // never multiplied.
  string period = 17;
  // The document's date (`YYYY-MM-DD`).
  string date = 18;
  // The confidence of the amount (of the subject when there is no amount), 0 to 1.
  float conf = 19;
  // How the facts were found: `rules`.
  string method = 20;
  // Line items, as the document lists them.
  repeated PaymentLine lines = 21;
  // Where each fact sits in the document text.
  repeated Highlight highlights = 22;
}

// One line item; amounts are decimal text, fields empty when unknown.
message PaymentLine {
  string description = 1;
  string quantity = 2;
  string unit = 3;
  string unit_price = 4;
  string total = 5;
  string currency = 6;
  string vat_rate = 7;
}

// Where a fact sits in the document text (quail's shared highlight shape). `block` is the
// `TextBlock.index` of GetDocumentText for the same record; `start` and `end` are characters
// (Unicode scalar values) of that block's text, end exclusive.
message Highlight {
  // The fact key it proves (`payment.amount`, `payment.subject`, `payment.lines`, ...).
  string key = 1;
  // The page index, from 0.
  uint32 page = 2;
  uint32 block = 3;
  uint32 start = 4;
  uint32 end = 5;
  // The passage as written.
  string quote = 6;
  // The fact's confidence.
  float conf = 7;
}

enum SpendGroupBy {
  // As `SPEND_GROUP_BY_CATEGORY`.
  SPEND_GROUP_BY_UNSPECIFIED = 0;
  SPEND_GROUP_BY_CATEGORY = 1;
  // By the year of the document's date (`2026`).
  SPEND_GROUP_BY_YEAR = 2;
  // By its month (`2026-03`).
  SPEND_GROUP_BY_MONTH = 3;
}

message SupplierSpendRequest {
  // One supplier (a UUID); empty for every supplier.
  string company_id = 1;
  SpendGroupBy group_by = 2;
}

message SupplierSpendResponse {
  // Ordered by company id; the documents without a supplier last, with an empty id.
  repeated SupplierSpend suppliers = 1;
  // More than 5000 totals or provides rows: the rest is left out.
  bool truncated = 2;
}

message SupplierSpend {
  // The company; empty for the documents without a supplier.
  string company_id = 1;
  // Its name (the company node's `name`).
  string name = 2;
  // Ordered by currency, period, group.
  repeated SpendTotal totals = 3;
  // What it provides: most documents first.
  repeated SupplierProvides provides = 4;
}

// The sum of one currency and period in one group. Never summed across currencies or
// periods.
message SpendTotal {
  // The category code, the year or the month; empty when unknown (no category, no date).
  string group = 1;
  // ISO 4217; empty when the documents do not say.
  string currency = 2;
  // `one_off`, `monthly`, `quarterly`, `yearly`; empty when the documents do not say.
  string period = 3;
  // The sum of the documents' amounts, decimal text. For a recurring period, the sum of the
  // fees as stated (per month for `monthly`).
  string total = 4;
  // The documents summed.
  uint32 documents = 5;
  // For a recurring period: `total` for a year (x12 monthly, x4 quarterly, x1 yearly);
  // empty otherwise.
  string annualized = 6;
  // What `total` is, for a reader: `one-off prices`, `monthly fees (per month)`, ...
  string label = 7;
}

message SupplierProvides {
  // The category code; empty when unknown.
  string category = 1;
  string category_label = 2;
  // The subject as the documents state it; empty when unknown.
  string subject = 3;
  uint32 documents = 4;
}

message GetDocumentCardRequest {
  // 64 hex digits.
  string blake3 = 1;
}

// One document's key-facts card (quail's `card.*`). A field the document does not state is
// empty (unset for the optional and message fields). Dates are `YYYY-MM-DD`, amounts exact
// decimal text, codes lowercase, the governing law an ISO 3166 code.
message DocumentCard {
  // 64 lowercase hex digits.
  string blake3 = 1;
  // The card as compact canonical JSON: the fields below by name (absent when not stated),
  // and `evidence`, per field its `conf` and `highlights` (`page`, `block`, `start`, `end`,
  // `quote`). Made to be handed to an LLM as context or as a tool result.
  string card_json = 2;
  // quail's instrument kind: `contract`, `msa`, `invoice`, `offer`, `nda`, ...
  string kind = 3;
  // The document's own number as written.
  string number = 4;
  CardParty supplier = 5;
  CardParty customer = 6;
  // Signing, start (effective), end (expiry), invoice issue and payment due dates as stated.
  string signed = 7;
  string start = 8;
  string end = 9;
  string issued = 10;
  string due = 11;
  // The duration of the contract.
  CardDuration term = 12;
  // Whether the contract renews by itself.
  optional bool auto_renewal = 13;
  // The notice period.
  CardDuration notice = 14;
  // Days to pay.
  optional uint32 payment_days = 15;
  // `bank_transfer`, `cash`, `card`, `compensation`.
  string payment_method = 16;
  // The price, its basis (`gross`, `net`, `unstated`), ISO 4217 currency and period
  // (`one_off`, `monthly`, `quarterly`, `yearly`).
  string amount = 17;
  string amount_basis = 18;
  string currency = 19;
  string period = 20;
  // What is paid for, and its category code (as `ListPayments`).
  string subject = 21;
  string category = 22;
  // Bank accounts and IBANs the document names.
  repeated string accounts = 23;
  CardAdvance advance = 24;
  // How the price may change: `cpi`, `inflation`, `exchange_rate`, `fixed`, `other`.
  string indexation = 25;
  CardPenalty penalty = 26;
  // Guarantee kinds: `bank_guarantee`, `bill_of_exchange`, `performance_bond`,
  // `letter_of_credit`, `parent_guarantee`, `deposit`.
  repeated string guarantees = 27;
  CardLiabilityCap liability_cap = 28;
  // Whether the document binds to confidentiality.
  optional bool confidentiality = 29;
  CardSla sla = 30;
  // The warranty period.
  CardDuration warranty = 31;
  // ISO 3166: a country (`RS`) or a subdivision (`GB-EAW`, England and Wales).
  string governing_law = 32;
  // The court for disputes.
  string court = 33;
  // Arbitration: the institution, else the rules, else `arbitration`.
  string arbitration = 34;
  // ISO 639-1.
  repeated string languages = 35;
  // Annex labels.
  repeated string annexes = 36;
  // The number of the document an amendment amends.
  string amends = 37;
  // Derived: the stated end, else the start (or signing) date plus the term.
  string ends = 38;
  // Derived: `ends` minus the notice period, the last day to give notice.
  string notice_due = 39;
  // Every stated field with its confidence and highlights, in name order.
  repeated CardField fields = 40;
}

// A party on the card.
message CardParty {
  string name = 1;
  // Serbian tax and registration numbers, a VAT number, another registration number.
  string pib = 2;
  string mb = 3;
  string vat = 4;
  string reg = 5;
  // A bank account or IBAN.
  string account = 6;
  string address = 7;
  string representative = 8;
}

// A duration: ISO 8601, with whole months or days (years as 12 months, weeks as 7 days).
message CardDuration {
  string iso = 1;
  optional uint32 months = 2;
  optional uint32 days = 3;
  // No fixed end (a term only).
  bool indefinite = 4;
}

message CardAdvance {
  optional double percent = 1;
  string amount = 2;
  string currency = 3;
}

message CardPenalty {
  // Percent of the value, per `day` or `week` of delay.
  optional double percent = 1;
  string per = 2;
  // A fixed amount.
  string amount = 3;
  string currency = 4;
  // The cap, percent of the value.
  optional double cap_percent = 5;
}

message CardLiabilityCap {
  string amount = 1;
  string currency = 2;
  optional double percent = 3;
  // `contract_value` or `fees_paid`.
  string basis = 4;
  // The fees of how many months.
  optional uint32 months = 5;
}

message CardSla {
  // Percent.
  optional double availability = 1;
  optional uint32 response_hours = 2;
  optional uint32 resolution_hours = 3;
}

// One field of the card.
message CardField {
  // The field's name (`notice`, `penalty`, ...; its fact key is `card.<name>`).
  string name = 1;
  // Its value as JSON.
  string value_json = 2;
  // Its confidence, 0 to 1.
  float conf = 3;
  // Where its source facts sit in the document text (`key` is `card.<name>`).
  repeated Highlight highlights = 4;
}

message FindDocumentsRequest {
  // `card.kind`: `contract`, `invoice`, ...
  string kind = 1;
  // The supplier or the customer company (a UUID; the document's `party` edge marked
  // `side: supplier` or `side: buyer`, as `ListPayments`).
  string supplier_id = 2;
  string customer_id = 3;
  // Text the supplier's or the customer's name contains (case and Serbian diacritics
  // ignored).
  string supplier_name = 4;
  string customer_name = 5;
  // A category code (as `ListPayments`).
  string category = 6;
  // ISO 4217; needed with an amount bound.
  string currency = 7;
  // Decimal text (`100000`, `1200.50`), inclusive.
  string amount_min = 8;
  string amount_max = 9;
  // Ends (`DocumentCard.ends`) on or before / on or after this day (`YYYY-MM-DD`).
  string end_before = 10;
  string end_after = 11;
  // Notice due (`DocumentCard.notice_due`) on or before / on or after this day.
  string notice_due_before = 12;
  string notice_due_after = 13;
  // Renews by itself (true) or does not (false, stated); unset for either.
  optional bool auto_renewal = 14;
  // Has a contractual penalty, or has none; unset for either.
  optional bool has_penalty = 15;
  // Has a guarantee, or has none; unset for either.
  optional bool has_guarantee = 16;
  // ISO 3166 (`RS`); a country finds its subdivisions too (`GB` finds `GB-EAW`, England and
  // Wales).
  string governing_law = 17;
  // Text the court's name contains (case and Serbian diacritics ignored).
  string court = 18;
  // Signed on or after / on or before this day.
  string signed_from = 19;
  string signed_to = 20;
  // 1 to 1000; 0 means 50.
  uint32 page_size = 21;
  // `next_page_token` of the previous page; empty for the first.
  string page_token = 22;
}

message FindDocumentsResponse {
  repeated FoundDocument documents = 1;
  // Empty on the last page.
  string next_page_token = 2;
}

// A document FindDocuments found: its card's searchable fields (`GetDocumentCard` has the
// rest). A field the card does not state is empty.
message FoundDocument {
  // 64 lowercase hex digits.
  string blake3 = 1;
  // The Document node, when its graph was written.
  string document_id = 2;
  string kind = 3;
  string number = 4;
  string subject = 5;
  // The supplier company and its name as the document writes it.
  string supplier_id = 6;
  string supplier_name = 7;
  // The customer company (`side: buyer`) and its name.
  string customer_id = 8;
  string customer_name = 9;
  string category = 10;
  // Decimal text, in `currency`.
  string amount = 11;
  string currency = 12;
  string period = 13;
  string signed = 14;
  string ends = 15;
  string notice_due = 16;
  optional bool auto_renewal = 17;
  bool has_penalty = 18;
  bool has_guarantee = 19;
  string governing_law = 20;
  string court = 21;
}
