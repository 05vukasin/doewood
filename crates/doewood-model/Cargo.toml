[package]
name = "doewood-model"
description = "doewood's shared data model: records, the graph, source claims and search, and the store traits both backends implement"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
# The backend conformance suite: one generic test run against every backend.
conformance = []

[dependencies]
async-trait.workspace = true
doewood-core.workspace = true
# `Serialize`, for writing JSON text without a `Value` tree.
serde = "1"
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
uuid.workspace = true

[dev-dependencies]
# The tests derive `Serialize` for the shapes they write.
serde = { version = "1", features = ["derive"] }

[lints]
workspace = true
