// Runtime configuration: S3 sources, their LLM policies, the AI providers, ingest's settings
// and company enrichment's (ADR 0001, sections 3, 5 and 6; ADR 0002, section 7). Changes apply without a restart. Secrets (S3
// credentials, API keys) are write-only: no response ever carries one, only whether one is
// set.
syntax = "proto3";

package doewood.v1;

import "doewood/v1/common.proto";

service ConfigService {
  // Adds a source. The source is first claimed in the shared store; a source another instance
  // owns fails with ALREADY_EXISTS naming that instance. An active source starts scanning at
  // once.
  rpc AddSource(AddSourceRequest) returns (Source);
  // Changes a source's options or credentials. The endpoint, bucket and prefix are its
  // identity and cannot change: remove it and add another.
  rpc UpdateSource(UpdateSourceRequest) returns (Source);
  // Stops scanning a source. A pass under way keeps its checkpoint and resumes later.
  rpc PauseSource(PauseSourceRequest) returns (Source);
  // Scans a paused (or failing) source again.
  rpc ResumeSource(ResumeSourceRequest) returns (Source);
  // Removes a source with its progress and credentials, and releases its claim.
  rpc RemoveSource(RemoveSourceRequest) returns (RemoveSourceResponse);
  // Releases the claim on a source in the shared store, whichever instance owns it, so that
  // another instance can add or resume it: for an owner that is gone for good (docs/deploy.md,
  // "A dead instance"). Only the claim row is deleted; nothing is taken over, and the owner's
  // own copy of the source is not touched. `owner` must name the instance that holds the
  // claim, else FAILED_PRECONDITION and nothing changes. Idempotent: with no claim on the
  // source, OK with `released` false. A claim this instance holds for one of its own sources is
  // refused with FAILED_PRECONDITION: remove the source instead.
  rpc ReleaseSourceClaim(ReleaseSourceClaimRequest) returns (ReleaseSourceClaimResponse);
  // This instance's sources, oldest first.
  rpc ListSources(ListSourcesRequest) returns (ListSourcesResponse);
  // One source.
  rpc GetSource(GetSourceRequest) returns (Source);
  // Sets which documents of a source get an LLM summary. Applies to documents queued from now
  // on, and to waiting ones: a queued document the new policy does not ask for is skipped.
  rpc SetLlmPolicy(SetLlmPolicyRequest) returns (Source);
  // Sets a source's SQS event inlet: the queue S3 sends the bucket's event notifications to,
  // directly or through SNS. The inlet polls while the source is scanned, next to its scanner
  // (the periodic scan still runs). A change applies at once, without a restart.
  rpc SetSqsInlet(SetSqsInletRequest) returns (Source);
  // Removes a source's SQS inlet and its credentials. Removing a source removes its inlet.
  rpc RemoveSqsInlet(RemoveSqsInletRequest) returns (Source);
  // Adds or replaces an AI provider. The LLM queue uses the default provider. For bedrock the
  // base URL is required, `https://bedrock-runtime.<region>.amazonaws.com`: the region is read
  // from it.
  rpc SetAiProvider(SetAiProviderRequest) returns (AiProvider);
  // The configured AI providers (never their keys).
  rpc ListAiProviders(ListAiProvidersRequest) returns (ListAiProvidersResponse);
  // Ingest's settings, with the defaults filled in.
  rpc GetIngestSettings(GetIngestSettingsRequest) returns (IngestSettings);
  // Changes ingest's settings; an unset field keeps its value. Applies to the next file
  // ingested (or `Summarize` call), without a restart. Edges already written are kept.
  rpc SetIngestSettings(SetIngestSettingsRequest) returns (IngestSettings);
  // Company enrichment's settings (ADR 0002 section 7), with the defaults filled in: the
  // registry switches, the EDGAR contact, the favicon fallback and egress proxy, and whether
  // each secret is set (never the secret).
  rpc GetEnrichmentSettings(GetEnrichmentSettingsRequest) returns (EnrichmentSettings);
  // Changes them, all or nothing; an unset field keeps its value. The enrichment job reads
  // them on every pass and the favicon proxy on every lookup: no restart.
  rpc SetEnrichmentSettings(SetEnrichmentSettingsRequest) returns (EnrichmentSettings);
  // The API server's limits (docs/api.md, "Limits"), with the defaults filled in.
  rpc GetApiSettings(GetApiSettingsRequest) returns (ApiSettings);
  // Changes them, all or nothing; an unset field keeps its value. Applies to the next call,
  // without a restart. Calls already running keep the deadline they started with.
  rpc SetApiSettings(SetApiSettingsRequest) returns (ApiSettings);
}

// How bucket URLs are built.
enum UrlStyle {
  // Path style.
  URL_STYLE_UNSPECIFIED = 0;
  // `https://endpoint/bucket/key`: MinIO, Ceph and most self-hosted stores.
  URL_STYLE_PATH = 1;
  // `https://bucket.endpoint/key`: AWS, R2, Wasabi. Needs a DNS name, not an IP.
  URL_STYLE_VIRTUAL_HOST = 2;
}

// S3 credentials. WRITE-ONLY: stored sealed with the master key, never returned.
message S3Credentials {
  string access_key_id = 1;
  string secret_access_key = 2;
  // For temporary credentials; empty for none.
  string session_token = 3;
}

// Which documents get an LLM summary.
enum LlmMode {
  // Off.
  LLM_MODE_UNSPECIFIED = 0;
  // None (the default).
  LLM_MODE_OFF = 1;
  // Every document.
  LLM_MODE_ALL = 2;
  // Only documents of the kinds listed in `kinds`.
  LLM_MODE_KINDS = 3;
  // None automatically; only through Summarize.
  LLM_MODE_ON_DEMAND = 4;
}

// A source's LLM policy. Ingest always stores the record first; summaries then go through the
// instance's LLM queue under this policy.
message LlmPolicy {
  LlmMode mode = 1;
  // Document kinds (`invoice`, `contract`, ...) for LLM_MODE_KINDS; empty otherwise.
  repeated string kinds = 2;
  // Summaries of this source in flight at once, 1 to 64; 0 means the default, 2.
  uint32 concurrency = 3;
  // Tokens (prompt plus completion, as the provider reports them, else estimated) the source's
  // queued summaries may spend per UTC day; 0 means no limit. No summary starts once the
  // day's spend reaches it (those in flight finish); waiting documents go on the next UTC
  // day. Summarize does not count against it.
  uint64 daily_token_budget = 4;
}

message AddSourceRequest {
  // `http://` or `https://` URL of the S3-compatible endpoint, without credentials, query or
  // fragment. A path (`https://gw/s3`) is kept as a prefix.
  string endpoint = 1;
  // The bucket.
  string bucket = 2;
  // Key prefix to watch; empty for the whole bucket.
  string prefix = 3;
  // Signing region; empty means `us-east-1` (what MinIO and Ceph accept). `auto` for R2.
  string region = 4;
  UrlStyle url_style = 5;
  // WRITE-ONLY. Unset reads the bucket anonymously.
  S3Credentials credentials = 6;
  // Seconds from the end of one scan pass to the start of the next, 1 to 604800; 0 means
  // the default, 300.
  uint64 scan_interval_seconds = 7;
  // GetObject size cap in bytes; 0 means the default, 512 MiB.
  uint64 max_object_bytes = 8;
  // Unset means off.
  LlmPolicy llm_policy = 9;
  // Add the source paused instead of scanning it.
  bool paused = 10;
  // Off by default. A new key whose single-part ETag (the content's MD5) and size match
  // content already stored is recorded against it without a GetObject. This trusts the
  // ETag: anyone who can write to the bucket can make an MD5 collision (docs/sources.md,
  // "Known copies").
  bool skip_known_copies = 11;
}

message Source {
  // A UUIDv7.
  string id = 1;
  // The endpoint as stored: scheme and host lowercased, no trailing `/`.
  string endpoint = 2;
  string bucket = 3;
  string prefix = 4;
  // The signing region in use.
  string region = 5;
  UrlStyle url_style = 6;
  // Whether credentials are stored. The credentials themselves are never returned.
  bool credentials_set = 7;
  uint64 scan_interval_seconds = 8;
  // The size cap in use.
  uint64 max_object_bytes = 9;
  LlmPolicy llm_policy = 10;
  SourceState state = 11;
  // Why the source is in the error state.
  string state_reason = 12;
  // The instance that owns (claimed) the source: this one. A source another instance claimed
  // is in the error state, with the owner in `state_reason`.
  string owner_instance = 13;
  // Whether its scanner task runs now.
  bool scanner_running = 14;
  // Unix seconds.
  int64 created_at = 15;
  int64 updated_at = 16;
  // Its SQS event inlet; unset when it has none.
  SqsInlet sqs_inlet = 17;
  // Whether known copies skip the GetObject (see AddSourceRequest).
  bool skip_known_copies = 18;
}

// A source's SQS event inlet.
message SqsInlet {
  string queue_url = 1;
  // The signing region in use.
  string region = 2;
  // Whether it polls (while the source is scanned).
  bool enabled = 3;
  // Whether the inlet has credentials of its own; without, it signs with the source's. The
  // credentials themselves are never returned.
  bool credentials_set = 4;
  // Whether its task runs now on this instance.
  bool running = 5;
  // Counters since the inlet last started on this instance.
  // Messages received from the queue.
  uint64 messages_received = 6;
  // Messages deleted from it: handed off, ignored, test events and malformed ones.
  uint64 messages_deleted = 7;
  // Discovery events sent (`new`, `changed`, `deleted`).
  uint64 events_emitted = 8;
  // Notification records ignored: another bucket, outside the prefix, already seen.
  uint64 records_ignored = 9;
  // `s3:TestEvent` messages.
  uint64 test_events = 10;
  // Messages that were not S3 event notifications (deleted after a warning).
  uint64 malformed_messages = 11;
  // Failed queue requests and hand-offs.
  uint64 errors = 12;
  // The last failure; empty when none. Never carries a credential.
  string last_error = 13;
  // When it happened, Unix seconds; 0 when none.
  int64 last_error_at = 14;
}

message SetSqsInletRequest {
  string source_id = 1;
  // The queue URL as SQS shows it: `https://sqs.<region>.amazonaws.com/<account>/<queue>`
  // (`http(s)://host[:port]/<account>/<queue>` for an SQS-compatible server), without
  // credentials, query or fragment.
  string queue_url = 2;
  // Signing region; empty means the region of an AWS queue URL, else `us-east-1`.
  string region = 3;
  // Store the inlet without polling (off).
  bool disabled = 4;
  // WRITE-ONLY. Credentials for the queue only, sealed with the master key. Unset keeps the
  // stored ones; with none stored the inlet signs with the source's credentials.
  S3Credentials credentials = 5;
  // Deletes the inlet's own credentials: it then signs with the source's.
  bool clear_credentials = 6;
}

message RemoveSqsInletRequest {
  string source_id = 1;
}

message UpdateSourceRequest {
  string source_id = 1;
  // Unset keeps the region; empty goes back to the default.
  optional string region = 2;
  // Unset keeps the URL style.
  optional UrlStyle url_style = 3;
  // Unset keeps the interval; 0 goes back to the default.
  optional uint64 scan_interval_seconds = 4;
  // Unset keeps the cap; 0 goes back to the default.
  optional uint64 max_object_bytes = 5;
  // WRITE-ONLY. Set replaces the stored credentials.
  S3Credentials credentials = 6;
  // Deletes the stored credentials: the bucket is then read anonymously.
  bool clear_credentials = 7;
  // Unset keeps the setting (see AddSourceRequest).
  optional bool skip_known_copies = 8;
}

message PauseSourceRequest {
  string source_id = 1;
}

message ResumeSourceRequest {
  string source_id = 1;
}

message RemoveSourceRequest {
  string source_id = 1;
}

message RemoveSourceResponse {
  // Whether this instance held a claim on the source in the shared store and released it.
  bool claim_released = 1;
}

message ReleaseSourceClaimRequest {
  // The source's identity, as in AddSourceRequest; the endpoint is normalized the same way.
  string endpoint = 1;
  string bucket = 2;
  string prefix = 3;
  // The instance that holds the claim (its `DOEWOOD_INSTANCE_ID`), as named by the
  // `claimed by instance ...` reason or the ALREADY_EXISTS error. Required.
  string owner = 4;
}

message ReleaseSourceClaimResponse {
  // Whether a claim was deleted; false when nobody held one.
  bool released = 1;
  // The instance whose claim was deleted; empty when none was.
  string owner = 2;
  // When it had claimed the source, in Unix seconds; 0 when no claim was deleted.
  int64 claimed_at = 3;
}

message ListSourcesRequest {}

message ListSourcesResponse {
  repeated Source sources = 1;
}

message GetSourceRequest {
  string source_id = 1;
}

message SetLlmPolicyRequest {
  string source_id = 1;
  LlmPolicy policy = 2;
}

message SetAiProviderRequest {
  // 1 to 64 lowercase letters, digits, `_` or `-`; empty means the preset's name.
  string name = 1;
  // One of: openai, openai_compatible, anthropic, bedrock, openrouter, groq, vllm, ollama
  // (the names of quail's ApiConfig and hedgehog).
  string preset = 2;
  // The model to ask, as the provider names it.
  string model = 3;
  // API base URL (`http://` or `https://`, without credentials); empty uses the preset's.
  // Required for openai_compatible.
  string base_url = 4;
  // WRITE-ONLY. Empty keeps the stored key. For bedrock, the bearer token (a Bedrock API key);
  // it wins over IAM credentials when both are stored.
  string api_key = 5;
  // Deletes the stored key.
  bool clear_api_key = 6;
  // Use this provider when a request names none. The first provider set is the default.
  bool make_default = 7;
  // bedrock only: IAM credentials, signed with SigV4 when no api_key is stored. WRITE-ONLY,
  // sealed like api_key, and replaced as one unit: set aws_access_key_id and
  // aws_secret_access_key together (both or neither), with aws_session_token for temporary
  // credentials (a new pair without one drops the stored token). All empty keep the stored
  // credentials. A bedrock provider needs api_key or the key pair.
  string aws_access_key_id = 8;
  string aws_secret_access_key = 9;
  // Only with the key pair.
  string aws_session_token = 10;
  // Deletes the stored IAM credentials (all three).
  bool clear_aws_credentials = 11;
}

message AiProvider {
  string name = 1;
  string preset = 2;
  string model = 3;
  string base_url = 4;
  // Whether an API key is stored. The key itself is never returned.
  bool api_key_set = 5;
  bool is_default = 6;
  // Unix seconds.
  int64 updated_at = 7;
  // Whether IAM credentials are stored (bedrock). They are never returned.
  bool aws_credentials_set = 8;
}

message ListAiProvidersRequest {}

message ListAiProvidersResponse {
  repeated AiProvider providers = 1;
  // Every preset name SetAiProvider accepts.
  repeated string presets = 2;
}

message IngestSettings {
  // Least MinHash Jaccard estimate for a `similar_to` edge: above 0, at most 1. Default 0.8.
  double similar_min_jaccard = 1;
  // On-demand `Summarize` analyses (with the object read before them), or reads of a stored
  // record (`blake3`), that run at once: 1 to 16. Default 2. A call beyond it is refused at
  // once with RESOURCE_EXHAUSTED.
  uint32 summarize_max_concurrent = 2;
  // Largest LSH band bucket the `similar_to` candidate query reads: a band key shared by more
  // documents is skipped as a template's boilerplate (the "stop band"). 10 to 1000000.
  // Default 1000.
  uint32 similar_max_bucket = 3;
}

message GetIngestSettingsRequest {}

message SetIngestSettingsRequest {
  // Above 0 and at most 1; anything else is INVALID_ARGUMENT. Unset keeps the stored value.
  optional double similar_min_jaccard = 1;
  // 1 to 16; anything else is INVALID_ARGUMENT. Unset keeps the stored value. Applies to the
  // next `Summarize` call; calls in flight keep running.
  optional uint32 summarize_max_concurrent = 2;
  // 10 to 1000000; anything else is INVALID_ARGUMENT. Unset keeps the stored value. Applies
  // to the next file; edges already written are kept.
  optional uint32 similar_max_bucket = 3;
}

// The API server's runtime limits. The connection limits (streams per connection, keepalive,
// connection age) are fixed, see docs/api.md.
message ApiSettings {
  // Calls the server runs at the same time; a call beyond it is refused at once with
  // UNAVAILABLE. A stream counts while it is set up, not while it is open; health
  // checks never count. 1 to 65536, default 256.
  uint32 max_calls_in_flight = 1;
  // The server's deadline for a call, in seconds: a call still running after it ends with
  // DEADLINE_EXCEEDED (a shorter client `grpc-timeout` wins). For a stream it bounds the
  // start only, not the open stream. `Summarize` has no server deadline (its analysis and
  // provider have their own). 1 to 3600, default 60.
  uint32 deadline_seconds = 2;
}

message GetApiSettingsRequest {}

message SetApiSettingsRequest {
  // 1 to 65536; anything else is INVALID_ARGUMENT. Unset keeps the stored value.
  optional uint32 max_calls_in_flight = 1;
  // 1 to 3600; anything else is INVALID_ARGUMENT. Unset keeps the stored value.
  optional uint32 deadline_seconds = 2;
}

// Company enrichment's settings. Secrets are never returned, only whether one is set.
message EnrichmentSettings {
  // The registry switches. All default on (ADR 0002 section 7: the keyless registries run
  // with nothing configured).
  bool gleif_enabled = 1;
  bool vies_enabled = 2;
  bool wikidata_enabled = 3;
  bool edgar_enabled = 4;
  bool apr_enabled = 5;
  // Companies House's switch. Default on, but it is asked only once a key is set: see
  // `companies_house_active`.
  bool companies_house_enabled = 6;
  // Whether a Companies House API key is stored.
  bool companies_house_api_key_set = 7;
  // Whether Companies House is asked: switched on and a key is set.
  bool companies_house_active = 8;
  // Whether an OpenCorporates API key is stored (no client uses it yet).
  bool opencorporates_api_key_set = 9;
  // The contact sent to the SEC in the `User-Agent` (a name and an email); empty: the
  // generic `User-Agent`.
  string edgar_contact = 10;
  // Whether extra root certificates for APR's download are stored.
  bool apr_extra_roots_set = 11;
  // Whether the public favicon fallback service is asked when a site has no usable icon.
  // Default off: asking it tells that service which domain is looked up.
  bool favicon_fallback = 12;
  // The proxy all favicon requests go through; empty: direct.
  string favicon_egress_proxy = 13;
  // The registry delta feed switches (ADR 0002 section 6). A feed is read only while its
  // registry is switched on too; one instance per cluster reads each. GLEIF's daily delta
  // files, default on.
  bool gleif_feed_enabled = 14;
  // EDGAR's daily index (new 10-K, 20-F and 8-K filings), default on.
  bool edgar_feed_enabled = 15;
  // APR's monthly open-data set, swapped in when a new one is published, default on.
  bool apr_feed_enabled = 16;
  // Companies House's streaming API, default off: see `companies_house_feed_active`.
  bool companies_house_feed_enabled = 17;
  // Whether a Companies House streaming key is stored.
  bool companies_house_stream_key_set = 18;
  // Whether the Companies House stream is read: its switch on, a streaming key set, and
  // Companies House asked (`companies_house_active`).
  bool companies_house_feed_active = 19;
}

message GetEnrichmentSettingsRequest {}

message SetEnrichmentSettingsRequest {
  // The registry switches. Unset keeps the stored value.
  optional bool gleif_enabled = 1;
  optional bool vies_enabled = 2;
  optional bool wikidata_enabled = 3;
  optional bool edgar_enabled = 4;
  optional bool apr_enabled = 5;
  optional bool companies_house_enabled = 6;
  // WRITE-ONLY. The Companies House API key: 8 to 256 printable ASCII characters without
  // spaces or `:`. Empty keeps the stored key.
  string companies_house_api_key = 7;
  // Deletes the stored Companies House key.
  bool clear_companies_house_api_key = 8;
  // WRITE-ONLY. The OpenCorporates API key, same format. Empty keeps the stored key.
  string opencorporates_api_key = 9;
  // Deletes the stored OpenCorporates key.
  bool clear_opencorporates_api_key = 10;
  // The EDGAR contact: at most 200 printable ASCII characters, such as
  // `Example Ops ops@example.invalid`. Unset keeps it; empty goes back to the generic
  // `User-Agent`.
  optional string edgar_contact = 11;
  // WRITE-ONLY. Extra root certificates APR's download trusts next to the system's, as a PEM
  // bundle of at most 64 KiB. Empty keeps the stored ones.
  string apr_extra_roots_pem = 12;
  // Deletes the stored extra roots.
  bool clear_apr_extra_roots_pem = 13;
  // The favicon fallback switch. Unset keeps it.
  optional bool favicon_fallback = 14;
  // The favicon egress proxy: an `http://` or `https://` URL without credentials. Unset
  // keeps it; empty removes it (direct).
  optional string favicon_egress_proxy = 15;
  // The delta feed switches. Unset keeps the stored value.
  optional bool gleif_feed_enabled = 16;
  optional bool edgar_feed_enabled = 17;
  optional bool apr_feed_enabled = 18;
  optional bool companies_house_feed_enabled = 19;
  // WRITE-ONLY. The Companies House streaming key (Companies House issues streaming keys
  // apart from REST keys), same format as the API key. Empty keeps the stored key.
  string companies_house_stream_key = 20;
  // Deletes the stored streaming key.
  bool clear_companies_house_stream_key = 21;
}
