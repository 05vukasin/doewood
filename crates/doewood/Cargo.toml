[package]
name = "doewood"
description = "Watches S3-compatible storage, extracts metadata with quail and hedgehog, and serves it over gRPC"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["ocr"]
# OCR of scanned pages in ingest (ONNX Runtime; the image ships with it). Without it, or without
# the model files, scanned pages are flagged `needs_ocr`.
ocr = ["doewood-ingest/ocr"]

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
clap = { version = "4.5", features = ["derive"] }
doewood-api.workspace = true
doewood-core.workspace = true
doewood-ingest.workspace = true
doewood-model.workspace = true
doewood-pg.workspace = true
# The favicon resolver behind GET /icons/{domain} (ADR 0002 section 5).
doewood-registry.workspace = true
doewood-s3.workspace = true
doewood-store.workspace = true
# Text exposition only; no protobuf, no process collector.
prometheus = { version = "0.14", default-features = false }
# `io-util`: `doewood health` speaks HTTP/1.1 over a plain `TcpStream` (no HTTP client).
tokio = { version = "1.47", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time", "io-util"] }
tracing = "0.1"
url = "2.5"
uuid.workspace = true
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt", "json", "env-filter", "ansi"] }

[dev-dependencies]
serde_json = "1"
tempfile = "3.20"

[lints]
workspace = true
