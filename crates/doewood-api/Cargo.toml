[package]
name = "doewood-api"
description = "doewood's gRPC API (tonic, with gRPC-Web, health and reflection): configuration, jobs, records, graph, search and summaries"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# The `GET /icons/{domain}` route next to the gRPC services (tonic's router is axum).
axum = { version = "0.8", default-features = false }
doewood-core.workspace = true
doewood-model.workspace = true
# Enrichment settings are checked with the registry clients' and the favicon guard's own
# validation (no request is sent from the API).
doewood-registry.workspace = true
doewood-s3.workspace = true
doewood-store.workspace = true
prost = "0.14"
serde_json.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time", "macros", "net"] }
tokio-stream = { version = "0.1", default-features = false, features = ["net"] }
# The server only: no TLS (the API sits behind the cluster network, ADR 0001 section 4).
tonic = { version = "0.14", default-features = false, features = ["transport", "router", "codegen"] }
tonic-health = { version = "0.14", default-features = false }
tonic-prost = "0.14"
tonic-reflection = { version = "0.14", default-features = false, features = ["server"] }
tonic-types = "0.14"
tonic-web = "0.14"
tower-layer = "0.3"
tracing.workspace = true
url = "2.5"
uuid.workspace = true

[build-dependencies]
# protox compiles the .proto files in pure Rust: no `protoc` on the build machine.
prost = "0.14"
protox = "0.10"
tonic-prost-build = { version = "0.14", default-features = false, features = ["transport"] }

[dev-dependencies]
doewood-pg.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-util"] }
tokio-postgres = { version = "0.7", default-features = false, features = ["runtime"] }

[lints]
workspace = true
