name: ci
# Full CI on every PR into staging (development) or main (release), and on pushes to both.
# Publishing the image is image.yml's job, from main and v* tags only.
on:
  push: { branches: [staging, main] }
  pull_request: { branches: [staging, main] }
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with: { components: "clippy, rustfmt" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The build without OCR (no ONNX Runtime) must keep working too.
      - run: cargo clippy -p doewood -p doewood-ingest --no-default-features --all-targets -- -D warnings
      - run: cargo test --workspace
  # The shared store against a real Postgres with pgvector; elsewhere those tests skip.
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: pw
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      DOEWOOD_TEST_POSTGRES_URL: postgres://postgres:pw@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
      # Fails if any Postgres test skipped instead of running.
      - run: |
          cargo test -p doewood-pg -p doewood-api -p doewood -p doewood-ingest -- --nocapture 2>&1 | tee test.log
          ! grep -q "skipping: DOEWOOD_TEST_POSTGRES_URL" test.log
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
  # The S3 integration tests (crates/doewood-s3/tests/minio.rs) against MinIO in a service
  # container. MinIO no longer publishes `minio/minio` images; the frozen Bitnami build starts
  # the server without arguments, which a service container needs.
  minio:
    runs-on: ubuntu-latest
    services:
      minio:
        image: bitnamilegacy/minio:2025.7.23
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports: ["9000:9000"]
    env:
      DOEWOOD_TEST_S3_ENDPOINT: http://127.0.0.1:9000
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
      - name: Wait for MinIO
        run: |
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:9000/minio/health/live && exit 0
            sleep 1
          done
          exit 1
      # Fails if any MinIO test skipped instead of running.
      - run: |
          cargo test -p doewood-s3 --test minio -- --nocapture 2>&1 | tee test.log
          ! grep -q "DOEWOOD_TEST_S3_ENDPOINT is not set: skipped" test.log
  # Ingest end to end: an S3 put in MinIO, the scanner, ingest, and the record, graph and
  # search in Postgres (crates/doewood-ingest/tests/minio_postgres.rs).
  ingest-e2e:
    runs-on: ubuntu-latest
    services:
      minio:
        image: bitnamilegacy/minio:2025.7.23
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports: ["9000:9000"]
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: pw
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      DOEWOOD_TEST_S3_ENDPOINT: http://127.0.0.1:9000
      DOEWOOD_TEST_POSTGRES_URL: postgres://postgres:pw@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
      - name: Wait for MinIO
        run: |
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:9000/minio/health/live && exit 0
            sleep 1
          done
          exit 1
      # Fails if the test skipped instead of running.
      - run: |
          cargo test -p doewood-ingest --test minio_postgres -- --nocapture 2>&1 | tee test.log
          ! grep -q "are not both set: skipped" test.log
  # Lint the workflows themselves (ci.yml and image.yml).
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.7 -color
  # The container image (Dockerfile) and the Helm chart (charts/doewood). Built, never pushed.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: doewood:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker run --rm doewood:ci version
          docker run -d --name dw -p 7444:7444 --read-only --cap-drop ALL --tmpfs /tmp \
            --tmpfs /data:uid=10001,gid=10001 doewood:ci
          for i in $(seq 1 60); do
            curl -sf 127.0.0.1:7444/readyz && break
            sleep 1
          done
          curl -sf 127.0.0.1:7444/healthz
          curl -sf 127.0.0.1:7444/readyz
          docker exec dw id
          test "$(docker exec dw id -u)" = 10001
          # OCR runs with the models of the image. Ingest is set up after the store is ready
          # (reading the models takes a moment), so wait for its log line.
          for i in $(seq 1 60); do
            docker logs dw 2>&1 | grep -q '"ocr":"Ready' && break
            sleep 1
          done
          docker logs dw 2>&1 | grep '"ingest configured"'
          docker logs dw 2>&1 | grep -q '"ocr":"Ready'
          docker rm -f dw
      - uses: azure/setup-helm@v4
        with: { version: v3.19.2 }
      - run: helm lint charts/doewood
      - run: |
          helm template t charts/doewood > /dev/null
          helm template t charts/doewood --set postgres.existingSecret=pg --set masterKey.existingSecret=mk > /dev/null
